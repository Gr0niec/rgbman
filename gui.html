<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rgbman</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e9ebef;
    --panel: #f7f8fa;
    --ink: #1c2027;
    --muted: #5b6370;
    --line: #d3d7de;
    --off: #c9cdd4;
    --accent: #00b4ff;
    --focus: #1c2027;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1c1f25;
      --panel: #252931;
      --ink: #e7e9ed;
      --muted: #979eaa;
      --line: #353a44;
      --off: #2f333b;
      --focus: #e7e9ed;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font: 600 26px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.01em;
  }
  .status { color: var(--muted); font-size: 13px; margin-right: auto; }

  .controls { display: flex; flex-direction: column; gap: 22px; }
  .group h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .effects { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .effect {
    padding: 9px 12px;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .effect[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .color-row { display: flex; gap: 10px; align-items: center; }
  input[type=color] {
    width: 52px; height: 40px; padding: 0;
    border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer;
  }
  .hex {
    width: 100px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .swatches { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line); cursor: pointer; padding: 0;
  }

  .slider label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .profiles { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; }
  .row > :first-child { flex: 1; min-width: 0; }
  select, .name {
    padding: 8px 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .btn {
    padding: 8px 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover, .effect:hover { border-color: var(--muted); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .devices { display: flex; flex-direction: column; gap: 12px; }
  .device {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 16px;
  }
  .device-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .device-name { font-weight: 600; }
  .device-meta { color: var(--muted); font-size: 13px; margin-right: auto; }
  .device.off .strip { opacity: 0.25; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .fx-toggle.active { border-color: var(--accent); }
  .fx-panel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px 18px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .fx-panel > label, .fx-color-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .fx-panel select { color: var(--ink); }
  .fx-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .fx-check input { margin: 0; accent-color: var(--accent); }
  .fx-color-field input[type=color] { width: 100%; height: 36px; }
  .fx-color-field input[type=color]:disabled { opacity: .4; cursor: default; }
  .fx-lead-label { display: flex; justify-content: space-between; }
  .error { color: #c4314b; font-size: 13px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  header { flex-wrap: wrap; }
  .app-notice { flex-basis: 100%; margin: 0; }
  .group .error { margin-bottom: 0; }

  /* the live light strip: the one loud thing on the page */
  .strip {
    display: flex;
    height: 34px;
    border-radius: 5px;
    overflow: hidden;
    gap: 2px;
    transition: opacity .2s;
  }
  .led { flex: 1; background: var(--off); }
  .strip.lit { filter: drop-shadow(0 6px 14px var(--glow, transparent)); }

  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 11px;
    background: var(--off); border: 1px solid var(--line); pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--ink);
    transition: transform .15s;
  }
  .switch input:checked + span { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); background: #fff; }
  .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

  .empty { padding: 28px; text-align: center; color: var(--muted); }

  dialog {
    width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .sheet { display: flex; flex-direction: column; gap: 22px; padding: 20px 22px 22px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .sheet .group { display: flex; flex-direction: column; gap: 12px; }
  .sheet .group h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .opt { display: flex; align-items: center; gap: 16px; cursor: pointer; }
  .opt > span:first-child { flex: 1; min-width: 0; }
  .opt small { display: block; color: var(--muted); font-size: 13px; }
  .opt input:disabled + span { opacity: .5; }
  .sheet .name { width: 100%; }
  .sheet .hint { margin: 0; }
  .zone { display: flex; align-items: center; gap: 12px; }
  .zone label { flex: 1; min-width: 0; }
  .zone small { display: block; color: var(--muted); font-size: 13px; }
  .zone input { width: 84px; padding: 8px 10px; background: var(--bg);
                border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; padding: 20px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>rgbman</h1>
    <span class="status" id="status">Łączenie…</span>
    <button class="btn" id="open-settings">Ustawienia</button>
    <button class="btn" id="rescan">Skanuj ponownie</button>
    <button class="btn primary" id="power">Wyłącz światła</button>
    <p class="error app-notice" id="app-notice" role="status" hidden></p>
  </header>

  <aside class="controls">
    <section class="group">
      <h2>Efekt</h2>
      <div class="effects" id="effects"></div>
      <p class="hint" id="audio-hint" hidden>Reaguje na dźwięk z domyślnego wyjścia audio Windows.</p>
      <p class="error" id="audio-error" hidden></p>
    </section>

    <section class="group">
      <h2>Kolor</h2>
      <div class="color-row">
        <input type="color" id="picker" aria-label="Wybierz kolor">
        <input class="hex" id="hex" maxlength="7" spellcheck="false" aria-label="Kolor w zapisie HEX">
      </div>
      <div class="swatches" id="swatches"></div>
    </section>

    <section class="group" id="color2-group">
      <h2>Drugi kolor</h2>
      <div class="color-row">
        <input type="color" id="picker2" aria-label="Wybierz drugi kolor">
        <input class="hex" id="hex2" maxlength="7" spellcheck="false" aria-label="Drugi kolor w zapisie HEX">
      </div>
    </section>

    <section class="group slider" id="speed-group">
      <label for="speed"><span id="speed-label">Prędkość</span><span id="speed-val"></span></label>
      <input type="range" id="speed" min="0.1" max="3" step="0.1">
    </section>

    <section class="group slider">
      <label for="brightness"><span>Jasność</span><span id="brightness-val"></span></label>
      <input type="range" id="brightness" min="0" max="100" step="1">
    </section>

    <section class="group profiles">
      <h2>Profile</h2>
      <div class="row">
        <select id="profile-list" aria-label="Zapisane profile"></select>
        <button class="btn" id="apply">Zastosuj</button>
        <button class="btn" id="delete">Usuń</button>
      </div>
      <div class="row">
        <input class="name" id="profile-name" placeholder="Nazwa profilu" aria-label="Nazwa nowego profilu">
        <button class="btn" id="save">Zapisz profil</button>
      </div>
    </section>
  </aside>

  <main class="devices" id="devices"></main>
</div>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title">Ustawienia</h2>
      <button class="btn primary" value="close">Gotowe</button>
    </div>
    <p class="error" id="notice" role="status" hidden></p>

    <section class="group">
      <h3>Uruchamianie</h3>
      <label class="opt">
        <span>Uruchamiaj z Windows
          <small id="autostart-help">Po zalogowaniu rgbman startuje w zasobniku. Windows poprosi o zgodę administratora przy zmianie, żeby rgbman mógł potem sam uruchamiać OpenRGB.</small>
        </span>
        <span class="switch"><input type="checkbox" id="opt-autostart"><span></span></span>
      </label>
      <label class="opt">
        <span>Uruchamiaj OpenRGB, jeśli nie działa
          <small>Z serwerem SDK, zminimalizowany do zasobnika.</small>
        </span>
        <span class="switch"><input type="checkbox" id="opt-start_openrgb" data-app="start_openrgb"><span></span></span>
      </label>
      <input class="name" id="opt-openrgb_path" spellcheck="false"
             placeholder="C:\Program Files\OpenRGB\OpenRGB.exe" aria-label="Ścieżka do OpenRGB.exe">
    </section>

    <section class="group">
      <h3>Animacja</h3>
      <label class="opt">
        <span>Płynność animacji
          <small>Ile klatek na sekundę liczy rgbman. Więcej to płynniejszy ruch i trochę więcej pracy dla CPU i USB. Wolniejsze urządzenia możesz ograniczyć osobno w „Dostosuj”. Najrówniej wychodzą limity, które dzielą tę wartość (np. 15 przy 30 albo 60).</small>
        </span>
        <select id="opt-fps" aria-label="Płynność animacji">
          <option value="20">20 kl./s</option>
          <option value="30">30 kl./s</option>
          <option value="45">45 kl./s</option>
          <option value="60">60 kl./s</option>
        </select>
      </label>
    </section>

    <section class="group">
      <h3>Zachowanie</h3>
      <label class="opt">
        <span>Zamknięcie okna chowa program do zasobnika
          <small>Wyłączone: zamknięcie okna kończy program.</small>
        </span>
        <span class="switch"><input type="checkbox" data-app="close_to_tray"><span></span></span>
      </label>
      <label class="opt">
        <span>Wyłączaj światła po zablokowaniu komputera
          <small>Win+L i ekran blokady. Włączają się po odblokowaniu.</small>
        </span>
        <span class="switch"><input type="checkbox" data-app="off_when_locked"><span></span></span>
      </label>
      <label class="opt">
        <span>Wyłączaj światła przy zamykaniu programu
          <small>Wyłączone: zostaje ostatni kolor, animacje się zatrzymują.</small>
        </span>
        <span class="switch"><input type="checkbox" data-app="off_on_exit"><span></span></span>
      </label>
    </section>

    <section class="group" id="zones-group">
      <h3>Złącza ARGB</h3>
      <p class="hint">Liczba LED-ów podłączonych do złącza. Wentylatory na rozgałęźniku liczysz raz, bo każdy dostaje ten sam sygnał.</p>
      <div class="group" id="zones"></div>
    </section>
  </form>
</dialog>

<script>
const SWATCHES = ["ff0040", "ff7a00", "ffd400", "00e676", "00b4ff", "6c4bff", "ff3df2", "ffffff"];
const BACKENDS = { openrgb: "OpenRGB", rivalcfg: "rivalcfg", hid: "HID" };

const $ = (id) => document.getElementById(id);
let settings = null;
let lastState = null;
let rendered = new Map();
let effectsById = {};

const call = (fn, ...args) => window.pywebview.api[fn](...args);

let pushTimer = null, pending = {};
function push(patch) {
  Object.assign(settings, patch);
  Object.assign(pending, patch);
  syncControls();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const body = pending; pending = {};
    pushTimer = null;
    call("settings", body).catch(showOffline);
  }, 40);
}

function syncControls() {
  const hex = "#" + settings.color;
  document.documentElement.style.setProperty("--accent", hex);
  $("picker").value = hex;
  if (document.activeElement !== $("hex")) $("hex").value = hex;
  $("picker2").value = "#" + settings.color2;
  if (document.activeElement !== $("hex2")) $("hex2").value = "#" + settings.color2;
  const fx = effectsById[settings.effect] || {};
  $("color2-group").hidden = !fx.color2;
  $("speed").value = settings.speed;
  $("speed-val").textContent = settings.speed.toFixed(1) + "×";
  $("brightness").value = Math.round(settings.brightness * 100);
  $("brightness-val").textContent = Math.round(settings.brightness * 100) + "%";
  $("speed-group").hidden = !fx.animated;
  $("speed-label").textContent = fx.audio ? "Czułość" : "Prędkość";
  $("audio-hint").hidden = !fx.audio;
  $("power").textContent = settings.power ? "Wyłącz światła" : "Włącz światła";
  document.querySelectorAll(".effect").forEach((b) =>
    b.setAttribute("aria-pressed", b.dataset.effect === settings.effect));
}

function buildStatic(effects) {
  $("effects").innerHTML = "";
  for (const e of effects) {
    effectsById[e.id] = e;
    const b = document.createElement("button");
    b.className = "effect";
    b.dataset.effect = e.id;
    b.textContent = e.label;
    b.onclick = () => push({ effect: e.id });
    $("effects").append(b);
  }
  $("swatches").innerHTML = "";
  for (const c of SWATCHES) {
    const s = document.createElement("button");
    s.className = "swatch";
    s.style.background = "#" + c;
    s.setAttribute("aria-label", "Kolor #" + c);
    s.onclick = () => push({ color: c });
    $("swatches").append(s);
  }
}

function renderProfiles(names) {
  const sel = $("profile-list");
  const current = sel.value;
  const key = names.join("\n");
  if (sel.dataset.key === key) return;
  sel.dataset.key = key;
  sel.innerHTML = names.length
    ? names.map((n) => `<option>${escapeHtml(n)}</option>`).join("")
    : `<option value="">Brak profili</option>`;
  if (names.includes(current)) sel.value = current;
  $("apply").disabled = $("delete").disabled = !names.length;
}

function renderDevices(devices, scanning) {
  const root = $("devices");
  if (!devices.length) {
    rendered.clear();
    root.innerHTML = `<div class="device empty">${scanning
      ? "Szukam urządzeń…"
      : "Nie widzę żadnych urządzeń. Sprawdź, czy serwer OpenRGB działa, i kliknij „Skanuj ponownie”."}</div>`;
    return;
  }
  const names = devices.map((d) => d.name).join("\n");
  if (root.dataset.key !== names) {
    root.dataset.key = names;
    root.innerHTML = "";
    rendered.clear();
    for (const d of devices) {
      const el = document.createElement("article");
      el.className = "device";
      el.innerHTML = `
        <div class="device-head">
          <span class="device-name"></span>
          <span class="device-meta"></span>
          <button class="btn small fx-toggle" aria-expanded="false">Dostosuj</button>
          <label class="switch"><input type="checkbox" class="power-switch"><span></span></label>
        </div>
        <div class="strip"></div>
        <div class="fx-panel" hidden>
          <label class="fx-anim">Efekt<select class="fx-effect"></select></label>
          <div class="fx-color-field">
            <label class="fx-check"><input type="checkbox" class="fx-own-color">Własny kolor</label>
            <input type="color" class="fx-color" aria-label="Własny kolor urządzenia">
          </div>
          <label class="fx-anim">Układ<select class="fx-layout">
            <option value="zones">Po strefach</option>
            <option value="uniform">Jeden kolor na całym urządzeniu</option>
          </select></label>
          <label class="fx-anim">
            <span class="fx-lead-label"><span>Wyprzedzenie</span><span class="fx-lead-val"></span></span>
            <input type="range" class="fx-lead" min="0" max="300" step="10">
          </label>
          <label class="fx-anim">Maks. klatek/s<select class="fx-fps"></select></label>
        </div>
        <div class="error" hidden></div>`;
      el.querySelector(".device-name").textContent = d.name;
      const input = el.querySelector(".power-switch");
      input.setAttribute("aria-label", "Podświetlenie: " + d.name);
      input.onchange = () => call("device", d.name, input.checked).catch(showOffline);
      wireDeviceFx(el, d.name);
      root.append(el);
      rendered.set(d.name, el);
    }
  }
  for (const d of devices) {
    const el = rendered.get(d.name);
    el.classList.toggle("off", !d.enabled || !settings.power);
    el.querySelector(".power-switch").checked = d.enabled;
    const leds = d.leds === 1 ? "1 LED" : `${d.leds} LED`;
    el.querySelector(".device-meta").textContent =
      `${BACKENDS[d.backend] || d.backend}, ${leds}${d.animated ? "" : ", tylko kolor statyczny"}${fxSummary(d)}`;
    syncDeviceFx(el, d);
    const err = el.querySelector(".error");
    err.hidden = !d.error;
    err.textContent = d.error ? "Błąd: " + d.error : "";

    const strip = el.querySelector(".strip");
    const preview = d.preview.length ? d.preview : ["000000"];
    if (strip.children.length !== preview.length) {
      strip.innerHTML = preview.map(() => `<div class="led"></div>`).join("");
    }
    let lit = false;
    preview.forEach((c, i) => {
      const dark = c === "000000";
      strip.children[i].style.background = "#" + c;
      lit ||= !dark;
    });
    strip.classList.toggle("lit", lit);
    strip.style.setProperty("--glow", "#" + preview[Math.floor(preview.length / 2)] + "66");
  }
}

// ---- per-device overrides ("Dostosuj")
const openFx = new Set();

function fxSummary(d) {
  const f = d.fx, parts = [];
  if (f.effect) parts.push(effectsById[f.effect]?.label || f.effect);
  if (f.color) parts.push("własny kolor");
  if (f.layout === "uniform") parts.push("jeden kolor");
  if (f.lead_ms) parts.push(`+${f.lead_ms} ms`);
  if (f.max_fps) parts.push(`max ${f.max_fps} kl./s`);
  return parts.length ? ` · ${parts.join(", ")}` : "";
}

const FPS_STEPS = [5, 10, 15, 20, 30, 45, 60];

function wireDeviceFx(el, name) {
  const q = (s) => el.querySelector(s);
  const send = (patch) => call("device_fx", name, patch).then(render).catch(showOffline);
  q(".fx-effect").innerHTML = `<option value="">Jak wszystkie</option>` + Object.values(effectsById)
    .map((e) => `<option value="${e.id}">${escapeHtml(e.label)}</option>`).join("");
  q(".fx-toggle").onclick = () => {
    const open = !openFx.has(name);
    open ? openFx.add(name) : openFx.delete(name);
    q(".fx-panel").hidden = !open;
    q(".fx-toggle").setAttribute("aria-expanded", open);
  };
  q(".fx-effect").onchange = (e) => send({ effect: e.target.value || null });
  q(".fx-layout").onchange = (e) => send({ layout: e.target.value });
  q(".fx-own-color").onchange = (e) => send({ color: e.target.checked ? q(".fx-color").value.slice(1) : null });
  let colorTimer = null;
  q(".fx-color").oninput = (e) => {
    clearTimeout(colorTimer);
    colorTimer = setTimeout(() => send({ color: e.target.value.slice(1) }), 60);
  };
  q(".fx-lead").oninput = (e) => { q(".fx-lead-val").textContent = `${e.target.value} ms`; };
  q(".fx-lead").onchange = (e) => send({ lead_ms: parseInt(e.target.value, 10) });
  q(".fx-fps").onchange = (e) => send({ max_fps: parseInt(e.target.value, 10) });
}

function syncDeviceFx(el, d) {
  const q = (s) => el.querySelector(s), f = d.fx;
  const idle = (node) => document.activeElement !== node;  // don't fight the user mid-edit
  const open = openFx.has(d.name);
  q(".fx-panel").hidden = !open;
  q(".fx-toggle").setAttribute("aria-expanded", open);
  q(".fx-toggle").classList.toggle("active", fxSummary(d) !== "");
  // static-only devices can't animate: only the color applies
  el.querySelectorAll(".fx-anim").forEach((n) => { n.hidden = !d.animated; });
  if (idle(q(".fx-effect"))) q(".fx-effect").value = f.effect || "";
  if (idle(q(".fx-layout"))) q(".fx-layout").value = f.layout;
  q(".fx-own-color").checked = !!f.color;
  const colorInput = q(".fx-color");
  colorInput.disabled = !f.color;
  if (idle(colorInput)) colorInput.value = "#" + (f.color || settings.color);
  if (idle(q(".fx-lead"))) {
    q(".fx-lead").value = f.lead_ms;
    q(".fx-lead-val").textContent = `${f.lead_ms} ms`;
  }
  const fpsSel = q(".fx-fps");
  if (idle(fpsSel)) {
    // "Auto" = the device's own limit, capped by the global setting
    const auto = Math.min(d.max_fps, lastState?.app.fps ?? d.max_fps);
    const key = `${auto}`;
    if (fpsSel.dataset.key !== key) {
      fpsSel.dataset.key = key;
      fpsSel.innerHTML = `<option value="0">Auto (${auto})</option>` +
        FPS_STEPS.map((n) => `<option value="${n}">${n}</option>`).join("");
    }
    fpsSel.value = String(f.max_fps);
  }
}

const AUTOSTART_HELP = {
  on: "Po zalogowaniu rgbman startuje w zasobniku i sam uruchamia OpenRGB, jeśli to włączysz niżej.",
  off: "Po zalogowaniu rgbman startuje w zasobniku. Windows poprosi o zgodę administratora przy zmianie, żeby rgbman mógł potem sam uruchamiać OpenRGB.",
  legacy: "Jest stary autostart z wiersza poleceń (stały profil „default”). Włączenie tej opcji go zastąpi.",
};

function openSettings() {
  const dlg = $("settings");
  if (!dlg.open) dlg.showModal();
  if (lastState) renderSettings(lastState);
}

function renderSettings(state) {
  if (!$("settings").open) return;
  const app = state.app;
  const auto = $("opt-autostart");
  if (!auto.dataset.busy) {
    auto.checked = app.autostart === "on";
    $("autostart-help").textContent = AUTOSTART_HELP[app.autostart];
  }
  document.querySelectorAll("#settings [data-app]").forEach((i) => { i.checked = app[i.dataset.app]; });
  if (document.activeElement !== $("opt-fps")) $("opt-fps").value = String(app.fps);
  const path = $("opt-openrgb_path");
  if (document.activeElement !== path) path.value = app.openrgb_path;
  path.hidden = !app.start_openrgb;
  $("notice").hidden = !app.notice;
  $("notice").textContent = app.notice || "";
  renderZones(state.devices);
}

function renderZones(devices) {
  const zones = devices.flatMap((d) => d.zones.map((z) => ({ dev: d.name, ...z })));
  $("zones-group").hidden = !zones.length;
  const root = $("zones");
  const key = zones.map((z) => [z.dev, z.name, z.size].join("\n")).join("\n");
  if (root.dataset.key === key || root.contains(document.activeElement)) return;
  root.dataset.key = key;
  root.innerHTML = "";
  zones.forEach((z, k) => {
    const row = document.createElement("div");
    row.className = "zone";
    row.innerHTML = `<label for="zone-${k}"><span></span><small></small></label>
      <input type="number" id="zone-${k}" inputmode="numeric" step="1">`;
    row.querySelector("span").textContent = z.name;
    row.querySelector("small").textContent = z.dev;
    const input = row.querySelector("input");
    Object.assign(input, { min: z.min, max: z.max, value: z.size });
    input.onchange = () => {
      const n = parseInt(input.value, 10);
      if (Number.isNaN(n) || n === z.size) return void (input.value = z.size);
      // one resize at a time: each one rescans the devices
      root.querySelectorAll("input").forEach((i) => { i.disabled = true; });
      const rebuild = () => { root.dataset.key = ""; };  // even if the size was refused
      call("zone_size", z.dev, z.name, n)
        .then((s) => { rebuild(); render(s); })
        .catch(() => { rebuild(); if (lastState) renderZones(lastState.devices); showOffline(); });
    };
    root.append(row);
  });
}

function render(state) {
  lastState = state;
  // power can also be flipped from the tray menu; adopt it unless we have an unsent change
  if (settings && !pushTimer && !("power" in pending) && settings.power !== state.settings.power) {
    settings.power = state.settings.power;
    syncControls();
  }
  $("app-notice").hidden = !state.app.notice || $("settings").open;
  $("app-notice").textContent = state.app.notice || "";
  renderSettings(state);
  renderProfiles(state.profiles);
  renderDevices(state.devices, state.scanning);
  $("audio-error").hidden = !state.audio_error;
  $("audio-error").textContent = state.audio_error ? "Błąd dźwięku: " + state.audio_error : "";
  const n = state.devices.length;
  $("status").textContent = state.scanning ? "Skanowanie…"
    : n === 1 ? "1 urządzenie" : n >= 2 && n <= 4 ? `${n} urządzenia` : `${n} urządzeń`;
}

function showOffline() {
  $("status").textContent = "Brak połączenia z silnikiem rgbman. Uruchom program ponownie.";
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

// ---- wiring
$("picker").oninput = (e) => push({ color: e.target.value.slice(1) });
$("hex").oninput = (e) => {
  const v = e.target.value.trim().replace(/^#/, "");
  if (/^[0-9a-f]{6}$/i.test(v)) push({ color: v.toLowerCase() });
};
$("hex").onblur = syncControls;
$("picker2").oninput = (e) => push({ color2: e.target.value.slice(1) });
$("hex2").oninput = (e) => {
  const v = e.target.value.trim().replace(/^#/, "");
  if (/^[0-9a-f]{6}$/i.test(v)) push({ color2: v.toLowerCase() });
};
$("hex2").onblur = syncControls;
$("speed").oninput = (e) => push({ speed: parseFloat(e.target.value) });
$("brightness").oninput = (e) => push({ brightness: parseInt(e.target.value, 10) / 100 });
$("power").onclick = () => push({ power: !settings.power });
$("rescan").onclick = () => call("rescan").then(render).catch(showOffline);
$("open-settings").onclick = openSettings;
document.querySelectorAll("#settings [data-app]").forEach((i) => {
  i.onchange = () => call("app_settings", { [i.dataset.app]: i.checked }).then(render).catch(showOffline);
});
$("opt-fps").onchange = (e) =>
  call("app_settings", { fps: parseInt(e.target.value, 10) }).then(render).catch(showOffline);
$("opt-openrgb_path").onchange = (e) =>
  call("app_settings", { openrgb_path: e.target.value.trim() }).then(render).catch(showOffline);
$("opt-autostart").onchange = async (e) => {
  const box = e.target;
  box.dataset.busy = "1";
  box.disabled = true;
  $("autostart-help").textContent = "Czekam na zgodę Windows…";
  try { render(await call("autostart", box.checked)); } catch { showOffline(); }
  delete box.dataset.busy;
  box.disabled = false;
  if (lastState) renderSettings(lastState);
};
// Enter in a text/number field commits it (change on blur) instead of submitting = closing the dialog
$("settings").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("input:not([type=checkbox])")) {
    e.preventDefault();
    e.target.blur();
  }
});
$("save").onclick = async () => {
  const name = $("profile-name").value.trim();
  if (!name) return $("profile-name").focus();
  const state = await call("profile_save", name).catch(showOffline);
  if (!state) return;
  $("profile-name").value = "";
  render(state);
  $("profile-list").value = name;
};
$("apply").onclick = async () => {
  const name = $("profile-list").value;
  if (!name) return;
  const state = await call("profile_apply", name).catch(showOffline);
  if (state) { settings = { ...state.settings }; syncControls(); render(state); }
};
$("delete").onclick = async () => {
  const name = $("profile-list").value;
  if (name && confirm(`Usunąć profil „${name}”?`)) {
    const state = await call("profile_delete", name).catch(showOffline);
    if (state) render(state);
  }
};

async function start() {
  try {
    const state = await call("state");
    settings = { ...state.settings };
    buildStatic(state.effects);
    syncControls();
    render(state);
  } catch { showOffline(); setTimeout(start, 2000); return; }

  async function poll() {
    try { render(await call("state")); }
    catch { showOffline(); }
    setTimeout(poll, 120);
  }
  poll();
}
if (window.pywebview?.api) start();
else window.addEventListener("pywebviewready", start, { once: true });
</script>
